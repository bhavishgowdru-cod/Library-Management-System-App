<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Register CSS -->

    <link
        rel="stylesheet"
        href="css/register.css">

</head>

<body>


    <div class="register-container">

        <div class="register-card">


            <!-- HEADING -->

            <div class="register-title">

                <h3>
                    Create Account
                </h3>

                <p>
                    Register to access the Library Management System
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FIRST NAME -->

                <div class="mb-3">

                    <label
                        for="firstName"
                        class="form-label">

                        First Name

                    </label>

                    <input
                        type="text"
                        id="firstName"
                        class="form-control"
                        placeholder="Enter first name"
                        required>

                </div>


                <!-- MIDDLE NAME -->

                <div class="mb-3">

                    <label
                        for="middleName"
                        class="form-label">

                        Middle Name

                    </label>

                    <input
                        type="text"
                        id="middleName"
                        class="form-control"
                        placeholder="Enter middle name">

                </div>


                <!-- LAST NAME -->

                <div class="mb-3">

                    <label
                        for="lastName"
                        class="form-label">

                        Last Name

                    </label>

                    <input
                        type="text"
                        id="lastName"
                        class="form-control"
                        placeholder="Enter last name"
                        required>

                </div>


                <!-- DOB -->

                <div class="mb-3">

                    <label
                        for="dob"
                        class="form-label">

                        Date of Birth

                    </label>

                    <input
                        type="date"
                        id="dob"
                        class="form-control"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="registerEmail"
                        class="form-label">

                        Email ID

                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter email address"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="registerPassword"
                        class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Enter password"
                        required>


                    <small class="password-info">

                        Password must contain at least 8 characters,
                        uppercase, lowercase, number and special character.

                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label">

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Re-enter password"
                        required>

                </div>


                <!-- MESSAGE -->

                <div
                    id="registerMessage"
                    class="mb-3">
                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Create Account

                </button>


                <!-- LOGIN -->

                <div class="text-center mt-3">

                    <span>
                        Already have an account?
                    </span>

                    <a
                        href="login.html"
                        class="text-decoration-none">

                        Login

                    </a>

                </div>


            </form>

        </div>

    </div>


    <!-- REGISTER JS -->

    <script src="js/register.js"></script>


</body>

</html>
