<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/change-password.css">

</head>

<body>


    <div class="container py-5">

        <div class="change-password-card">

            <div class="mb-4">

                <h3>
                    Change Password
                </h3>

                <p class="text-muted">
                    Update your LMS account password.
                </p>

            </div>


            <form id="changePasswordForm">


                <div class="mb-3">

                    <label
                        for="currentPassword"
                        class="form-label">

                        Current Password

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="currentPassword"
                            class="form-control"
                            placeholder="Enter current password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="currentPassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <div class="mb-3">

                    <label
                        for="newPassword"
                        class="form-label">

                        New Password

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Enter new password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label">

                        Confirm New Password

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm new password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <div
                    id="passwordMessage"
                    class="password-message">
                </div>


                <div class="d-flex justify-content-between mt-4">

                    <a
                        href="settings.html"
                        class="btn btn-secondary">

                        Back

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Password

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="js/script.js"></script>

    <script src="js/change-password.js"></script>

</body>

</html>
