<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LMS Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Auth CSS -->

    <link
        rel="stylesheet"
        href="css/auth.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">

            <i class="bi bi-book"></i>

        </div>


        <!-- TITLE -->

        <div class="auth-title">

            <h2>
                Library Management System
            </h2>

            <p>
                Sign in to continue
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="loginEmail"
                    class="form-label">

                    Email Address

                </label>


                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-2">

                <label
                    for="loginPassword"
                    class="form-label">

                    Password

                </label>


                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="text-end mb-3">

                <a
                    href="forgot-password.html"
                    class="auth-link">

                    Forgot Password?

                </a>

            </div>


            <!-- ERROR -->

            <div
                id="loginError"
                class="auth-message text-danger">
            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="btn auth-btn w-100">

                Login

            </button>


            <div class="auth-divider">

                <span>
                    New to LMS?
                </span>

            </div>


            <!-- REGISTER -->

            <div class="text-center">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="register.html"
                    class="auth-link">

                    Create Account

                </a>

            </div>


        </form>


    </div>


</div>


<script src="js/login.js"></script>


</body>

</html>
