<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link
        rel="stylesheet"
        href="css/auth.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <div class="auth-logo">

            <i class="bi bi-shield-lock"></i>

        </div>


        <div class="auth-title">

            <h2>
                Forgot Password?
            </h2>

            <p>
                Enter your registered email address
            </p>

        </div>


        <form id="forgotPasswordForm">


            <div class="mb-3">

                <label
                    for="forgotEmail"
                    class="form-label">

                    Registered Email

                </label>


                <input
                    type="email"
                    id="forgotEmail"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required>

            </div>


            <div
                id="forgotMessage"
                class="auth-message">
            </div>


            <button
                type="submit"
                class="btn auth-btn w-100">

                Send OTP

            </button>


            <!-- DUMMY OTP -->

            <div
                id="otpDemo"
                class="otp-demo d-none">

            </div>


            <div class="text-center mt-4">

                <a
                    href="login.html"
                    class="auth-link">

                    <i class="bi bi-arrow-left"></i>

                    Back to Login

                </a>

            </div>


        </form>


    </div>


</div>


<script src="js/forgot-password.js"></script>


</body>

</html>
