<!-- =====================================================

===================================================== -->

<div class="main-content">


   <!-- =================================================
     NAVBAR
================================================== -->

<nav class="navbar bg-white shadow-sm px-3 mb-4">


    <!-- =============================================
         SIDEBAR BUTTON
    ============================================== -->

    <button
        type="button"
        id="sidebarToggle"
        class="btn btn-outline-primary"
        aria-label="Toggle sidebar">

        <i class="bi bi-list"></i>

    </button>


    <!-- =============================================
         PAGE TITLE
    ============================================== -->

    <span class="navbar-brand ms-3">

        Dashboard

    </span>


    <!-- =================================================
         RIGHT SIDE OF HEADER
    ================================================== -->

    <div class="navbar-right-section">


        <!-- =============================================
             NOTIFICATION
        ============================================== -->

        <div class="notification-wrapper">


            <button
                type="button"
                class="notification-btn"
                id="notificationBtn"
                aria-label="Notifications">

                <i class="bi bi-bell"></i>


                <span
                    class="notification-badge"
                    id="notificationBadge">

                    0

                </span>

            </button>


            <!-- =========================================
                 NOTIFICATION PANEL
            ========================================== -->

            <div
                class="notification-panel"
                id="notificationPanel">


                <!-- NOTIFICATION HEADER -->

                <div class="notification-header">


                    <h6 class="mb-0">

                        Notifications

                    </h6>


                    <div class="d-flex align-items-center">


                        <!-- MARK ALL READ -->

                        <button
                            type="button"
                            class="btn btn-sm btn-link"
                            id="markAllReadBtn">

                            <i class="bi bi-check2-all"></i>

                            Mark all as read

                        </button>


                        <!-- CLEAR ALL -->

                        <button
                            type="button"
                            id="clearAllNotifications"
                            class="btn btn-sm btn-link text-danger">

                            <i class="bi bi-trash"></i>

                            Clear All

                        </button>


                    </div>

                </div>


                <!-- NOTIFICATION LIST -->

                <div
                    class="notification-list"
                    id="notificationList">
                </div>


                <!-- EMPTY MESSAGE -->

                <div
                    class="notification-empty text-center p-4"
                    id="notificationEmpty">

                    <i
                        class="bi bi-bell-slash fs-2 text-muted">
                    </i>


                    <p class="text-muted mb-0 mt-2">

                        No new notifications

                    </p>

                </div>


            </div>

        </div>



        <!-- =============================================
             REQUEST CHAT
        ============================================== -->

            class="navbar-request-icon"
            title="Extension Requests"
            aria-label="Extension Requests">

            <i class="bi bi-chat-dots"></i>

                class="request-count-badge"
                id="globalExtensionRequestBadge">

                0

            </span>

        <!-- =============================================
             SETTINGS

        <!-- =============================================
             PROFILE
        ============================================== -->

            href="profile.html"

        </a>

    <!-- =================================================
         PAGE CONTENT
    ================================================= -->

    <main class="container-fluid p-4">


        <!-- PAGE HEADING -->

        <h2>

            My Profile

        </h2>
        


        <p class="text-muted">

            Manage your library administrator profile.

        </p>



<!-- =================================================
     PROFILE ROW
================================================= -->

<div class="row g-4">


    <!-- =================================================
         SAVED PROFILE PREVIEW
    ================================================= -->

    <div class="col-12">

        <div class="card shadow-sm mb-4">

            <div class="card-header bg-white">

                <h5 class="mb-0">

                    <i class="bi bi-person-circle"></i>

                    My Profile

                </h5>

            </div>


            <div class="card-body text-center">


                <!-- PROFILE PHOTO -->

                <div class="profile-photo-wrapper">

                    <!-- DEFAULT PROFILE ICON -->

                    <i
                        id="profilePreviewIcon"
                        class="bi bi-person-circle profile-preview-icon">
                    </i>


                    <!-- UPLOADED PROFILE PHOTO -->

                    <img
                        id="profilePreviewPhoto"
                        src=""
                        alt="Profile Photo"
                        class="profile-preview-image d-none">

                </div>


                <!-- NAME -->

                <h4
                    id="profilePreviewName"
                    class="mt-3">
                </h4>


                <!-- EMAIL -->

                <p
                    id="profilePreviewEmail"
                    class="text-muted mb-2">
                </p>


                <!-- ROLE -->

                <span
                    id="profilePreviewRole"
                    class="badge bg-primary">
                </span>

            </div>

        </div>

    </div>



<!-- =================================================
     PROFILE INFORMATION FORM
================================================= -->

<div class="col-12">

    <div class="card shadow-sm">

        <!-- CARD HEADER -->

        <div class="card-header bg-white">

            <h5 class="mb-0">

                <i class="bi bi-pencil-square me-2"></i>

                Profile Information

            </h5>

        </div>


        <!-- CARD BODY -->

        <div class="card-body">

            <form id="profileForm">


                <!-- =================================================
                     FULL NAME + EMAIL
                ================================================= -->

                <div class="row">

                    <!-- FULL NAME -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="profileName"
                            class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="profileName"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="profileEmail"
                            class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            id="profileEmail"
                            class="form-control"
                            placeholder="Enter email address"
                            required>

                    </div>

                </div>


                <!-- =================================================
                     PHONE + ROLE
                ================================================= -->

                <div class="row">

                    <!-- PHONE -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="profilePhone"
                            class="form-label">

                            Phone

                        </label>

                        <input
                            type="tel"
                            id="profilePhone"
                            class="form-control"
                            placeholder="Enter 10 digit phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>

                    </div>


                    <!-- ROLE -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="profileRole"
                            class="form-label">

                            Role

                        </label>

                        <select
                            id="profileRole"
                            class="form-select"
                            required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Staff">
                                Staff
                            </option>

                            <option value="Administrator">
                                Administrator
                            </option>

                            <option value="Management">
                                Management
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =================================================
                     MEMBER ID + ACCOUNT STATUS
                ================================================= -->

                <div class="row">

                    <!-- MEMBER ID -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="memberId"
                            class="form-label">

                            User / Member ID

                        </label>

                        <input
                            type="text"
                            id="memberId"
                            class="form-control"
                            value="M001"
                            readonly>

                    </div>


                    <!-- ACCOUNT STATUS -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="accountStatus"
                            class="form-label">

                            Account Status

                        </label>

                        <select
                            id="accountStatus"
                            class="form-select"
                            required>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =================================================
                     DEPARTMENT + DATE OF JOINING
                ================================================= -->

                <div class="row">

                    <!-- DEPARTMENT -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="profileDepartment"
                            class="form-label">

                            Department

                        </label>

                        <input
                            type="text"
                            id="profileDepartment"
                            class="form-control"
                            placeholder="Enter department"
                            required>

                    </div>


                    <!-- DATE OF JOINING -->

                    <div class="col-md-6 mb-3">

                        <label
                            for="joiningDate"
                            class="form-label">

                            Date of Joining

                        </label>

                        <input
                            type="date"
                            id="joiningDate"
                            class="form-control"
                            readonly>

                    </div>

                </div>


                <!-- =================================================
                     ADDRESS
                ================================================= -->

                <div class="mb-3">

                    <label
                        for="profileAddress"
                        class="form-label">

                        Address

                    </label>

                    <textarea
                        id="profileAddress"
                        class="form-control"
                        rows="3"
                        placeholder="Enter your address"></textarea>

                </div>


                <!-- =================================================
                     PROFILE PICTURE
                ================================================= -->

                <div class="mb-3">

                    <label
                        for="profilePicture"
                        class="form-label">

                        Profile Picture

                    </label>

                    <input
                        type="file"
                        id="profilePicture"
                        class="form-control"
                        accept="image/*">

                </div>


                <!-- =================================================
                     RESET + SAVE BUTTONS
                ================================================= -->

                <div class="text-end mt-3">

                    <!-- RESET -->

                    <button
                        type="reset"
                        id="resetProfileBtn"
                        class="btn btn-outline-secondary btn-sm me-2">

                        <i class="bi bi-arrow-counterclockwise me-1"></i>

                        Reset

                    </button>


                    <!-- SAVE -->

                    <button
                        type="submit"
                        id="saveProfileBtn"
                        class="btn btn-primary btn-sm">

                        <i class="bi bi-check-circle me-1"></i>

                        Save

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
