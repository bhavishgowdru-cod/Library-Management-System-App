<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password | LMS</title>


    <!-- BOOTSTRAP CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- BOOTSTRAP ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- AUTH CSS -->

    <link
        rel="stylesheet"
        href="css/auth.css">

</head>


<body>


    <!-- =================================================
         RESET PASSWORD CONTAINER
    ================================================== -->

    <div class="auth-container">


        <div class="auth-card">


            <!-- ICON -->

            <div class="auth-logo">

                <i class="bi bi-shield-lock-fill"></i>

            </div>


            <!-- TITLE -->

            <div class="auth-title">

                <h2>
                    Create New Password
                </h2>

                <p>
                    Your new password must be different
                    from your previous password.
                </p>

            </div>


            <!-- =================================================
                 RESET PASSWORD FORM
            ================================================== -->

            <form id="resetPasswordForm">


                <!-- NEW PASSWORD -->

                <div class="mb-3">

                    <label
                        for="newPassword"
                        class="form-label">

                        New Password

                    </label>


                    <div class="password-wrapper">

                        <i
                            class="bi bi-lock password-left-icon">
                        </i>


                        <input
                            type="password"
                            id="newPassword"
                            class="form-control password-input"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleNewPassword"
                            aria-label="Show or hide new password">

                            <i
                                class="bi bi-eye"
                                id="newPasswordEye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- PASSWORD REQUIREMENTS -->

                <div class="password-requirements">

                    <div class="requirement-title">

                        Password must contain:

                    </div>


                    <div>

                        <i class="bi bi-check-circle"></i>

                        Minimum 8 characters

                    </div>


                    <div>

                        <i class="bi bi-check-circle"></i>

                        Uppercase and lowercase letter

                    </div>


                    <div>

                        <i class="bi bi-check-circle"></i>

                        At least one number

                    </div>


                    <div>

                        <i class="bi bi-check-circle"></i>

                        At least one special character

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label
                        for="confirmNewPassword"
                        class="form-label">

                        Confirm New Password

                    </label>


                    <div class="password-wrapper">

                        <i
                            class="bi bi-lock password-left-icon">
                        </i>


                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="form-control password-input"
                            placeholder="Re-enter new password"
                            autocomplete="new-password"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Show or hide confirm password">

                            <i
                                class="bi bi-eye"
                                id="confirmPasswordEye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="resetMessage"
                    class="auth-message">
                </div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    class="btn auth-btn w-100">

                    <i class="bi bi-shield-check me-2"></i>

                    Reset Password

                </button>


                <!-- BACK TO LOGIN -->

                <div class="text-center mt-4">

                    <a
                        href="login.html"
                        class="auth-link">

                        <i class="bi bi-arrow-left me-1"></i>

                        Back to Login

                    </a>

                </div>


            </form>


        </div>


    </div>


    <!-- RESET PASSWORD JS -->

    <script src="js/reset-password.js"></script>


    <!-- PASSWORD SHOW / HIDE -->

    <script>

        /* NEW PASSWORD */

        const toggleNewPassword =
            document.getElementById(
                "toggleNewPassword"
            );

        const newPasswordEye =
            document.getElementById(
                "newPasswordEye"
            );


        toggleNewPassword.addEventListener(
            "click",
            function () {

                if (
                    newPassword.type ===
                    "password"
                ) {

                    newPassword.type =
                        "text";

                    newPasswordEye.className =
                        "bi bi-eye-slash";

                }

                else {

                    newPassword.type =
                        "password";

                    newPasswordEye.className =
                        "bi bi-eye";

                }

            }
        );


        /* CONFIRM PASSWORD */

        const toggleConfirmPassword =
            document.getElementById(
                "toggleConfirmPassword"
            );

        const confirmPasswordEye =
            document.getElementById(
                "confirmPasswordEye"
            );


        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (
                    confirmNewPassword.type ===
                    "password"
                ) {

                    confirmNewPassword.type =
                        "text";

                    confirmPasswordEye.className =
                        "bi bi-eye-slash";

                }

                else {

                    confirmNewPassword.type =
                        "password";

                    confirmPasswordEye.className =
                        "bi bi-eye";

                }

            }
        );

    </script>


</body>

</html>
